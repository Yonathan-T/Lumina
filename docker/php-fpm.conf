; php-fpm pool overrides. Listen on TCP so nginx (same container) can reach it.
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Small footprint suited to a free-tier container (~512MB RAM).
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Surface php-fpm logs to the container stdout/stderr.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
